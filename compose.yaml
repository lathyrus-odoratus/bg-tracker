# 本機開發用的 Postgres。5432 常被佔用、5433 給 huddle，所以對外用 5434。
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bg
      POSTGRES_PASSWORD: bg
      POSTGRES_DB: bg_tracker
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/compose-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bg']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
